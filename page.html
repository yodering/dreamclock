<meta charset="utf-8">
<title>dreamclock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: the shader is the whole page. Single dark world, matching the shader's own background. */
  :root { --ink: #07080e; color-scheme: dark }
  html, body { height: 100%; background: var(--ink); overflow: hidden }
  #stage { position: relative; width: 100%; height: 100%; touch-action: none; cursor: crosshair;
    user-select: none; -webkit-user-select: none }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
</style>

<div id="stage" role="img" aria-label="A clock drawn by a hand-wired neural network. Moving the pointer changes its weights.">
  <canvas id="gl"></canvas>
</div>

<script>
const DATA = /*CLOCK_DATA*/null
const stage = document.getElementById('stage')
const canvas = document.getElementById('gl')
const gl = canvas.getContext('webgl2', {antialias: false})

let seed = 7
function rand() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
function gauss() { return Math.sqrt(-2 * Math.log(rand() + 1e-9)) * Math.cos(6.283185307 * rand()) }

const P0 = Float32Array.from(DATA.params)
const n = P0.length
const P = new Float32Array(Math.ceil(n / 4) * 4)
// Two random directions through weight space. A click fades from the old pair to a new pair.
const directions = () => {
  const U = new Float32Array(n), V = new Float32Array(n)
  for (let j = 0; j < n; j++) {
    const scale = 0.035 * Math.abs(P0[j]) + 0.05
    U[j] = gauss() * scale
    V[j] = gauss() * scale
  }
  return {U, V}
}
let from = directions(), to = from, blend = 1
function reroll() {
  const mixed = {U: new Float32Array(n), V: new Float32Array(n)}
  const e = ease(blend)
  for (let j = 0; j < n; j++) {
    mixed.U[j] = from.U[j] + (to.U[j] - from.U[j]) * e
    mixed.V[j] = from.V[j] + (to.V[j] - from.V[j]) * e
  }
  from = mixed
  seed = (Math.random() * 1e9) | 0
  to = directions()
  blend = 0
}
const ease = t => t * t * (3 - 2 * t)

// Pointer position picks a point (a, b) on the slice; the center is the exact hand-written weights.
const curve = v => Math.sign(v) * Math.pow(Math.abs(v), 1.6) * 2.4
let target = {a: 0, b: 0}, cur = {a: 0, b: 0}, vel = {a: 0, b: 0}
let lastPointer = -1e9
function pointer(event) {
  const rect = stage.getBoundingClientRect()
  const nx = (event.clientX - rect.left) / rect.width * 2 - 1
  const ny = (event.clientY - rect.top) / rect.height * 2 - 1
  target = {a: curve(Math.max(-1, Math.min(1, nx))), b: curve(Math.max(-1, Math.min(1, ny)))}
  lastPointer = performance.now()
}
stage.addEventListener('pointermove', pointer)
stage.addEventListener('pointerdown', event => {
  pointer(event)
  if (event.pointerType === 'mouse') reroll()
})
// Touch: a double tap rerolls, since a single touch is how you move.
let lastTap = 0
stage.addEventListener('pointerup', event => {
  if (event.pointerType === 'mouse') return
  const now = performance.now()
  if (now - lastTap < 320) reroll()
  lastTap = now
})
window.addEventListener('keydown', event => {
  if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); reroll() }
  if (event.key === 'Escape' || event.key === '0') { target = {a: 0, b: 0}; lastPointer = performance.now() }
})

if (gl) {
  const vs = `#version 300 es
  void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`
  const compile = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s)
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s))
    return s
  }
  const prog = gl.createProgram()
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs))
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, DATA.shader))
  gl.linkProgram(prog)
  gl.useProgram(prog)
  const ubo = gl.createBuffer()
  gl.bindBuffer(gl.UNIFORM_BUFFER, ubo)
  gl.bufferData(gl.UNIFORM_BUFFER, P.byteLength, gl.DYNAMIC_DRAW)
  gl.uniformBlockBinding(prog, gl.getUniformBlockIndex(prog, 'Weights'), 0)
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, ubo)
  const u = name => gl.getUniformLocation(prog, name)
  const loc = {res: u('uRes'), scale: u('uScale'), soft: u('uSoft'), colon: u('uColon'), show: u('uShow'), time: u('uTime'), digits: u('uDigits')}
  gl.bindVertexArray(gl.createVertexArray())
  gl.uniform1f(loc.show, -1)

  let then = performance.now()
  function frame(now) {
    const dt = Math.min(0.05, (now - then) / 1000); then = now
    // Idle: drift in and out of the readable region on its own.
    if (now - lastPointer > 3000) {
      const t = now / 1000
      const r = 1.1 * (0.5 - 0.5 * Math.cos(t * 0.3))
      target = {a: r * Math.cos(t * 0.17), b: r * Math.sin(t * 0.23)}
    }
    for (const key of ['a', 'b']) {
      const k = 60, c = 2 * Math.sqrt(k)
      vel[key] += (k * (target[key] - cur[key]) - c * vel[key]) * dt
      cur[key] += vel[key] * dt
    }
    blend = Math.min(1, blend + dt / 1.2)
    const e = ease(blend)
    for (let j = 0; j < n; j++) {
      const U = from.U[j] + (to.U[j] - from.U[j]) * e
      const V = from.V[j] + (to.V[j] - from.V[j]) * e
      P[j] = P0[j] + cur.a * U + cur.b * V
    }
    gl.bindBuffer(gl.UNIFORM_BUFFER, ubo)
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, P)

    const dpr = Math.min(window.devicePixelRatio || 1, 2)
    const w = Math.round(stage.clientWidth * dpr), h = Math.round(stage.clientHeight * dpr)
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h }
    gl.viewport(0, 0, w, h)
    const L = DATA.layout
    const scale = Math.min(w * 0.8 / L.width, h * 0.4 / L.height)
    const soft = Math.min(1, Math.hypot(cur.a, cur.b) / 1.2)

    const date = new Date()
    const hh = date.getHours(), mm = date.getMinutes(), s = date.getSeconds(), ms = date.getMilliseconds()
    const morph = ms > 750 && s % 10 !== 9 ? (ms - 750) / 250 : 0
    const digits = [Math.floor(hh / 10), hh % 10, Math.floor(mm / 10), mm % 10, Math.floor(s / 10), (s % 10) + ease(morph)]

    gl.uniform2f(loc.res, w, h)
    gl.uniform1f(loc.scale, scale)
    gl.uniform1f(loc.soft, soft)
    gl.uniform1f(loc.colon, ms < 500 ? 1 : 0.15)
    gl.uniform1f(loc.time, now / 1000)
    gl.uniform1fv(loc.digits, digits)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
}
</script>
